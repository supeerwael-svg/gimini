name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web App with Hardcoded Keys
        run: |
          echo "VITE_SUPABASE_URL=https://xpmbrohtyhllhcczbmfp.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwbWJyb2h0eWhsbGhjY3pibWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MDMzNzk0LCJleHAiOjIwNDE2MjEwODk1NTQzNH0.2bYqru2hKsfHvzgA_KoQ4z5TTD_DaDNboduZV27FWLc" >> .env
          
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx vite build --base=./
      - name: Initialize and Sync Capacitor Android
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init EduTrack com.edutrack.app --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
