name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Inject Mobile Error Overlay & Build Web App
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          sed -i 's/<head>/<head><script>window.onerror=function(m,u,l){document.body.innerHTML="<div style=\\"color:#ff6b6b;background:#1a1a1a;padding:24px;direction:ltr;font-family:monospace;font-size:14px;\\"><h3>App Error:<\/h3><p>"+m+"<\/p><p>Line: "+l+"<\/p><\/div>";};window.onunhandledrejection=function(e){document.body.innerHTML="<div style=\\"color:#ff6b6b;background:#1a1a1a;padding:24px;direction:ltr;font-family:monospace;font-size:14px;\\"><h3>Promise Error:<\/h3><p>"+(e.reason?e.reason.message||e.reason:"Unknown")+"<\/p><\/div>";};<\/script>/' index.html
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx vite build --base=./

      - name: Initialize and Sync Capacitor Android
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init EduTrack com.edutrack.app --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
